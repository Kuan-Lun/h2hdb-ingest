name: Formal verification

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      deep:
        description: Run the larger Hypothesis state-machine profile
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  windows-pytest-process-supervision:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install isolated pytest runtime
        run: python -m pip install pytest==9.1.1

      - name: Verify Windows Job Object process-tree ownership
        run: >-
          python -m pytest -o addopts= -o required_plugins=
          -q tests/test_pytest_budget_runner_windows.py

  incremental-reference-properties:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install exact generated-test runtime
        run: python -m pip install pytest==9.1.1 hypothesis==6.165.10

      - name: Compare incremental and full evaluators over generated traces
        run: python -m pytest -q tests/test_vnext_incremental_state_machine.py

  incremental-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install checksum-pinned Elan and repository-pinned Lean
        shell: bash
        env:
          ELAN_VERSION: "4.2.3"
          ELAN_SHA256: "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
        run: |
          set -euo pipefail
          elan_archive="${RUNNER_TEMP}/elan-${ELAN_VERSION}.tar.gz"
          elan_home="${RUNNER_TEMP}/elan-home"
          curl --proto '=https' --tlsv1.2 \
            --fail --location --silent --show-error \
            --output "${elan_archive}" \
            "https://github.com/leanprover/elan/releases/download/v${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "${ELAN_SHA256}" "${elan_archive}" \
            | sha256sum --check --strict
          tar --extract --gzip \
            --file "${elan_archive}" \
            --directory "${RUNNER_TEMP}"
          ELAN_HOME="${elan_home}" "${RUNNER_TEMP}/elan-init" \
            -y \
            --default-toolchain none \
            --no-modify-path
          echo "ELAN_HOME=${elan_home}" >> "${GITHUB_ENV}"
          echo "${elan_home}/bin" >> "${GITHUB_PATH}"
          lean_toolchain="$(tr -d '\r\n' < lean-toolchain)"
          ELAN_HOME="${elan_home}" "${elan_home}/bin/elan" \
            toolchain install "${lean_toolchain}"
          ELAN_HOME="${elan_home}" "${elan_home}/bin/lean" --version

      - name: Check Lean proofs without warnings
        run: python scripts/verify-formal.py lean

  cbz-projection-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch checksum-pinned TLC
        run: python scripts/fetch-formal-tools.py

      - name: Model-check finite CBZ projection lifecycle
        run: >-
          python scripts/verify-formal.py tla
          --tla-jar .formal-tools/tla2tools-1.7.4.jar

  incremental-reference-properties-deep:
    if: github.event_name == 'schedule' || inputs.deep == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Install exact generated-test runtime
        run: python -m pip install pytest==9.1.1 hypothesis==6.165.10

      - name: Explore larger incremental state-machine traces
        env:
          H2HDB_HYPOTHESIS_PROFILE: nightly
        run: python -m pytest -q tests/test_vnext_incremental_state_machine.py
