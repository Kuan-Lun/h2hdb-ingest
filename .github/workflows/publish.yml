name: Publish to PyPI

on:
  push:
    paths:
      - pyproject.toml
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact unpublished project version to recover
        required: true
        type: string
      expected_revision:
        description: Exact default-branch commit SHA to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: >-
      ${{ github.ref ==
      format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install packaging tools
        run: python -m pip install --upgrade packaging build

      - name: Check version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push)
              python scripts/check-publish-version.py \
                --before-revision "${BEFORE_SHA}"
              ;;
            workflow_dispatch)
              python scripts/check-publish-recovery.py \
                --expected-version "${EXPECTED_VERSION}" \
                --expected-revision "${EXPECTED_REVISION}"
              ;;
            *)
              printf 'unsupported GitHub event: %s\n' "${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Build distributions
        if: steps.version.outputs.bumped == 'true'
        run: python -m build

      - name: Smoke-test wheel
        if: steps.version.outputs.bumped == 'true'
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --force-reinstall "$WHEEL"
          python -c "import h2hdb_ingest"
          h2hdb-ingest --help
          h2hdb-ingest-bootstrap --help

      - name: Store distributions
        if: steps.version.outputs.bumped == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: validate
    if: needs.validate.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
