\* Required finite profile: arbitrary workers, batches, completion orders,
\* failures, and publish-last for four pages.  TLC coverage is bounded by
\* these constants and is not a Python/Pillow/filesystem refinement proof.
SPECIFICATION Spec

CONSTANTS
    PageCount = 4
    MaxWorkers = 4

INVARIANTS
    TypeOK
    WorkerCountHardBound
    BatchSizeHardBound
    FinishedWithinCurrentBatch
    OrderedCollectIsSequentialPrefix
    AllCollectedBeforePostProcessing
    ReadyOrPublishedHasSequentialSerialization
    FailurePreservesDestination
    DestinationChangesOnlyAtPublish
    PublishedDestinationIsSequential
