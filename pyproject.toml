[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h2hdb-ingest"
version = "0.1.0"
description = "Filesystem ingest and CBZ reconciliation for H2HDB"
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = { file = "LICENSE" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "h2h-galleryinfo-parser>=0.4,<0.5",
    "h2hdb>=0.20.0.0,<0.21",
    "pillow>=12.3.0,<13.0.0",
    "pydantic>=2.13.4,<3.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
h2hdb-ingest = "h2hdb_ingest.__main__:main"
h2hdb-ingest-bootstrap = "h2hdb_ingest.bootstrap:main"

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pymarkdownlnt>=0.9.39",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/h2hdb-ingest"
Source = "https://github.com/Kuan-Lun/h2hdb-ingest"
Tracker = "https://github.com/Kuan-Lun/h2hdb-ingest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/h2hdb_ingest"]

[tool.black]
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-ignore = ["E203", "E226", "E501"]
